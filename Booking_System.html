<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Usage & Tracking System (DUTS)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-900">
    <div id="app-container" class="relative min-h-screen flex items-center p-4">
        <div class="section-center w-full max-w-7xl mx-auto">

            <!-- ✅ TAB BUTTONS -->
            <div class="flex justify-center mb-6 text-white">
                <button class="nav-btn" id="tab-booking">BORANG PINJAMAN</button>
                <button class="nav-btn" id="tab-status">STATUS DRONE</button>
            </div>

            <!-- ✅ TAB 1 — BORANG PINJAMAN -->
            <div id="tab-booking-content" class="tab-content active">
                <div class="booking-form mx-auto">
                    <div class="form-header text-center mb-8">
                        <h1 class="text-5xl font-extrabold text-yellow-500 capitalize tracking-wider">
                            Drone Asset Monitoring System (DAMS)
                        </h1>
                        <p class="text-gray-400 mt-2 text-sm">
                            Sistem Pinjaman dan Pengembalian Drone
                        </p>
                    </div>

                    <form id="booking-form">
                        <div class="form-row">
                            <!-- Kiri -->
                            <div class="form-column">
                                <div class="form-group">
                                    <span class="form-label">Nama Peminjam:</span>
                                    <input class="form-control" type="text" name="NamaPeminjam" placeholder="Masukkan Nama Anda" required>
                                </div>
                                <div class="form-group">
                                    <span class="form-label">Site (Peminjam):</span>
                                    <select class="form-control" name="SitePeminjam" required>
                                        <option value="" disabled selected>Pilih Lokasi Anda</option>
                                        <option>HQ</option>
                                        <option>MSB - BRI</option>
                                        <option>MSB - OFFICE ROMS</option>
                                        <option>MSB - OFFICE RONS</option>
                                        <option>MSB - OFFICE RONJ</option>
                                        <option>MSB - HSA</option>
                                        <option>MSB - MKA</option>
                                        <option>MSB - HTJ</option>
                                        <option>MSB - KTG</option>
                                        <option>MSB - HSI</option>
                                        <option>MSB - PER</option>
                                        <option>MSB - MKJ</option>
                                        <option>MSB - AGJ</option>
                                        <option>MSB - TGK</option>
                                        <option>MSB - MER</option>
                                        <option>MSB - JLB</option>
                                        <option>MSB - JMP</option>
                                        <option>MSB - PON</option>
                                        <option>MSB - KUL</option>
                                        <option>MSB - JSN</option>
                                        <option>MSB - KLN</option>
                                        <option>MSB - BPH</option>
                                        <option>MSB - PDX</option>
                                        <option>MSB - MUR</option>
                                        <option>MSB - SGT</option>
                                        <option>MSB - TMP</option>
                                        <option>MSB - KPL</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <span class="form-label">Model Drone:</span>
                                    <select class="form-control" name="DroneModel" required>
                                        <option value="" disabled selected> Pilih Model Drone</option>
                                        <option value="Matrice 4T">DJI Matrice 4T</option>
                                        <!--<option value="Phantom 4 Pro">DJI Phantom 4 Pro</option>-->
                                    </select>
                                </div>
                            </div>

                            <!-- Kanan -->
                            <div class="form-column">
                                <div class="form-group">
                                    <span class="form-label">Tujuan Penerbangan:</span>
                                    <input class="form-control" type="text" name="TujuanPenerbangan" placeholder="Cth: Pemeriksaan Gutter" required>
                                </div>
                                <div class="form-group">
                                    <span class="form-label">Lokasi Penerbangan:</span>
                                    <input class="form-control" type="text" name="LokasiPenerbangan" placeholder="Cth: Hospital Tuanku Jaafar" required>
                                </div>
                                <div class="form-group flex gap-3">
                                    <div class="w-1/2">
                                        <span class="form-label">Tarikh Ambil:</span>
                                        <input class="form-control" type="date" name="TarikhAmbil" required>
                                    </div>
                                    <div class="w-1/2">
                                        <span class="form-label">Masa Ambil:</span>
                                        <input class="form-control" type="time" name="MasaAmbil" required>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Butang -->
                        <div class="form-btn mt-6">
                            <button class="submit-btn" type="submit">
                                HANTAR REKOD PINJAMAN
                            </button>
                        </div>

                        <!-- Mesej Status -->
                        <div id="booking-message" class="mt-3 text-center text-sm font-bold"></div>
                    </form>
                </div>
            </div>

            <!-- ✅ TAB 2 — STATUS DRONE -->
            <div id="tab-status-content" class="tab-content">
                <div class="dashboard-card mx-auto">
                    <h2 class="text-3xl font-extrabold text-yellow-500 text-center mb-4">STATUS PINJAMAN DRONE</h2>
                    <div id="status-container" class="grid gap-4 max-h-[1000px] overflow-y-auto pr-2"></div>
                </div>
            </div>

        </div>
    </div>
    <a href="PANDUAN MENGISI BORANG PINJAMAN DRONE.pdf" target="_blank" id="panduan-btn" class="floating-btn">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
        </svg>
        <span class="ml-2 hidden sm:inline">Panduan Penggunaan</span>
    </a>

    <script src="script.js"></script>
</body>
</html>
